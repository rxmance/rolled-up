<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Search a business to see what kind of ownership is behind it." />
  <title>Rolled Up — Who owns it?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="wordmark">ROLLED UP</div>
      <div class="header-note">WHO OWNS THE BUSINESS?</div>
    </header>

    <section class="hero">
      <div class="eyebrow">WHAT KIND OF BUSINESS IS THIS?</div>
      <h1>Who owns it?</h1>
      <p class="intro">Search a business and see the ownership behind it: private equity, public company, corporate, independent, family owned, franchise, or something else.</p>

      <form id="search-form" class="search-form">
        <div class="search-row">
          <input id="query" class="input search-input" placeholder="Business, brand, product or service" autocomplete="off" required />
          <button id="search-button" class="search-button" type="submit">Search</button>
        </div>
        <div class="location-row">
          <input id="city" class="input city-input" placeholder="City (optional)" autocomplete="address-level2" />
          <button id="location-button" type="button" class="location-link">◎ Use my location</button>
          <span id="location-status" class="location-status"></span>
        </div>
      </form>
    </section>

    <section id="status" class="status hidden"></section>
    <section id="result" class="result hidden"></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
